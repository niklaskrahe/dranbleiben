<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dranbleiben</title>
<meta name="description" content="Persönlicher Habit Tracker mit Serien, Fokus-Timer und Wochenrückblick">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dranbleiben">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:400;font-display:swap;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-weight:600;font-display:swap;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2")}

/* Farben & Schriften: gleiche Familie wie das Sportduell */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --track:#eef1f5; --line:#d9dee5; --fg:#16202b; --muted:#5b6774;
  --accent:#1d7a4a; --accent-ink:#ffffff; --flame:#d2531a; --warn:#a6262a; --note:#fff4d6;
  --c-blue:#2a78d6; --c-orange:#eb6834; --c-aqua:#1baf7a; --c-yellow:#eda100;
  --c-magenta:#e87ba4; --c-green:#008300; --c-violet:#6250d6; --c-red:#e34948;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --tabh:62px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#10161d; --surface:#18212b; --track:#141c25; --line:#2b3642; --fg:#e7edf3; --muted:#97a3b0;
  --accent:#5cc48c; --accent-ink:#0d1a12; --flame:#f0834f; --warn:#f07a7e; --note:#3a3220;
  --c-blue:#3987e5; --c-orange:#d95926; --c-aqua:#199e70; --c-yellow:#c98500;
  --c-magenta:#d55181; --c-green:#2f9a3a; --c-violet:#9085e9; --c-red:#e66767;
  color-scheme:dark}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(1.9rem,8vw,2.5rem);line-height:1}
h2{font-size:1.35rem;line-height:1.1}
h3{font-size:1.05rem;line-height:1.15}
p{margin:0}

.wrap{max-width:640px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(var(--tabh) + 36px + env(safe-area-inset-bottom,0px));display:grid;gap:18px}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.hint{color:var(--muted);font-size:.84rem}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grow{flex:1;min-width:0}

/* Buttons */
.primary{background:var(--fg);color:var(--bg);border:0;padding:11px 16px;border-radius:6px;font-weight:600}
.primary:disabled{opacity:.45}
.accentbtn{background:var(--accent);color:var(--accent-ink);border:0;padding:11px 16px;border-radius:6px;font-weight:600}
.ghost{background:transparent;border:1px solid var(--line);padding:7px 12px;border-radius:6px;font-size:.88rem;font-weight:500}
.danger{color:var(--warn)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:1.2rem;line-height:1;padding:0}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.85rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

/* Kopf "Heute" */
.top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.top .sub{margin-top:6px;color:var(--muted)}
.ring{position:relative;width:76px;height:76px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .tr{stroke:var(--track)}
.ring .pr{stroke:var(--accent);transition:stroke-dashoffset .5s ease}
.ring .lab{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .lab b{font-family:var(--display);font-weight:800;font-size:1.5rem}
.ring .lab span{font-size:.68rem;color:var(--muted);margin-top:2px}

.lvl{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;text-align:left;width:100%}
.lvl .badge{font-family:var(--display);font-weight:800;font-size:1.05rem;text-transform:uppercase;white-space:nowrap}
.lvl .xp{font-family:var(--mono);font-size:.76rem;color:var(--muted);white-space:nowrap}
.meter{height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 16%,var(--track));overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s ease}

/* Datumsleiste */
.days{display:grid;grid-template-columns:repeat(7,1fr) auto;gap:4px;align-items:stretch}
.day{border:1px solid transparent;background:none;border-radius:8px;padding:6px 0 7px;display:grid;justify-items:center;gap:3px}
.day small{font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.day b{font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem}
.day .mini{width:26px;height:26px}
.day .mini circle{fill:none;stroke-width:4}
.day .mini .tr{stroke:var(--track)} .day .mini .pr{stroke:var(--accent)}
.day[aria-current="date"]{border-color:var(--fg);background:var(--surface)}
.day.perfect .mini .tr{stroke:var(--accent)}
.datepick{position:relative;display:grid;place-items:center;border:1px dashed var(--line);border-radius:8px;width:40px;font-size:1.1rem;color:var(--muted)}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0}

.banner{background:var(--note);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.good{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.banner b{font-weight:600}

/* Gewohnheiten-Karten */
.sec{display:grid;gap:8px}
.sec > .label{display:flex;justify-content:space-between;padding:0 2px}
.habit{--h:var(--c-blue);position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:8px;padding:10px 10px 10px 12px;min-height:66px;cursor:pointer;-webkit-user-select:none;user-select:none;overflow:hidden}
.habit::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--h)}
.habit .ico{width:44px;height:44px;border-radius:10px;background:color-mix(in srgb,var(--h) 16%,var(--surface));display:grid;place-items:center;font-size:1.45rem;line-height:1}
.habit .nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.habit .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.8rem;color:var(--muted);margin-top:2px}
.habit .meta .fl{color:var(--fg);font-weight:600}
.habit .bar{position:absolute;left:4px;right:0;bottom:0;height:3px;background:transparent}
.habit .bar i{display:block;height:100%;background:var(--h);opacity:.7}
.habit.done{background:color-mix(in srgb,var(--h) 7%,var(--surface))}
.habit.done .nm{color:var(--muted)}
.habit.skip{border-style:dashed;opacity:.7}
.habit.skip::before{background:var(--line)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:.74rem;font-weight:600;white-space:nowrap;background:var(--track);color:var(--muted)}
.chip.star{background:color-mix(in srgb,var(--c-yellow) 22%,var(--surface));color:var(--fg)}

.chk{width:46px;height:46px;border-radius:50%;border:2px solid var(--h);background:transparent;display:grid;place-items:center;padding:0;color:var(--h)}
.chk svg{width:24px;height:24px}
.chk path{fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chk:not(.on) path.ck{stroke:var(--line)}
.chk.on{background:var(--h);color:#fff}
.chk.tm{position:relative}
.chk.tm .play{fill:currentColor;stroke:none}
.tctl{display:flex;align-items:center;gap:8px}
.addmin{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;line-height:1;padding:0;color:var(--h)}
.cnt{display:grid;grid-template-columns:34px auto 34px;align-items:center;gap:4px}
.cnt button{height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;line-height:1;padding:0}
.cnt .cv{border-radius:6px;border:0;background:none;min-width:44px;padding:0 2px;font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.cnt .cv small{color:var(--muted);font-size:.75rem}
.cnt .plus{border-color:var(--h);color:var(--h)}
.habit.done .cnt .plus{background:var(--h);color:#fff}
@media (prefers-reduced-motion:no-preference){
  .pop .chk,.pop .cnt .plus{animation:pop .38s ease}
  .pop .ico{animation:wiggle .5s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-10deg) scale(1.1)}60%{transform:rotate(8deg)}}
}
/* Aufgaben */
.todo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:56px;cursor:pointer;-webkit-user-select:none;user-select:none}
.todo .chk{--h:var(--fg);width:34px;height:34px;border-radius:8px;border-width:2px}
.todo .chk svg{width:20px;height:20px}
.todo .chk.on{color:var(--bg)}
.todo .nm{line-height:1.3;overflow-wrap:anywhere}
.todo .meta{font-size:.78rem;color:var(--muted);margin-top:1px}
.todo .late{color:var(--warn);font-weight:600}
.todo.done{background:transparent}
.todo.done .nm{color:var(--muted);text-decoration:line-through}
.sec > .label.late-l{color:var(--warn)}
.ghost.sm{padding:5px 10px;font-size:.8rem;white-space:nowrap}
.tadd{display:grid;grid-template-columns:minmax(0,1fr) 44px 44px;gap:6px}
.tadd .datepick{width:auto}
.tadd .accentbtn{padding:0;font-size:1.4rem;line-height:1}
@media (prefers-reduced-motion:no-preference){.pop.todo .chk{animation:pop .38s ease}}
details.more summary{cursor:pointer;color:var(--muted);font-size:.86rem;padding:4px 2px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";}
details.more[open] summary::before{content:"▾ ";}
details.more .sec{margin-top:8px}

/* Tagesnotiz */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.moods button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 0 4px;display:grid;justify-items:center;gap:2px}
.moods button span{font-size:1.5rem;line-height:1.1}
.moods button small{font-size:.68rem;color:var(--muted)}
.moods button[aria-pressed="true"]{border-color:var(--fg);background:var(--surface);box-shadow:inset 0 0 0 1px var(--fg)}
.switch{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.switch input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}

/* Timer-Pille */
.tpill{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:10px 14px}
.tpill b{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* Statistik */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.tile .v{font-family:var(--body);font-weight:600;font-size:1.7rem;line-height:1.1}
.tile .d{font-size:.78rem;color:var(--muted)}
.tile .d.up{color:var(--accent)} .tile .d.down{color:var(--warn)}
.heat{display:grid;grid-template-columns:22px 1fr;gap:4px}
.heat .wd{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:.62rem;color:var(--muted);align-items:center}
.heat .grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat .c{aspect-ratio:1;border-radius:2px;background:var(--track);border:0;padding:0;min-width:0}
.heat .c[data-l="1"]{background:color-mix(in srgb,var(--accent) 28%,var(--track))}
.heat .c[data-l="2"]{background:color-mix(in srgb,var(--accent) 52%,var(--track))}
.heat .c[data-l="3"]{background:color-mix(in srgb,var(--accent) 76%,var(--track))}
.heat .c[data-l="4"]{background:var(--accent)}
.heat .c.pz{background:repeating-linear-gradient(45deg,var(--track) 0 2px,var(--line) 2px 3px)}
.heat .c.fu{background:transparent}
.heat .c.sel{outline:2px solid var(--fg);outline-offset:1px}
.heat .ms{grid-column:2;display:grid;grid-auto-flow:column;font-size:.62rem;color:var(--muted);height:12px}
.legend{display:flex;align-items:center;gap:4px;font-size:.72rem;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.infoline{font-size:.84rem;min-height:1.3em;color:var(--muted)}
.infoline b{color:var(--fg);font-weight:600}

.hl{list-style:none;margin:0;padding:0}
.hl li{border-bottom:1px solid var(--line)}
.hl li:last-child{border-bottom:0}
.hl button{width:100%;background:none;border:0;padding:10px 0;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left}
.hl .hrow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0}
.hl .e{font-size:1.3rem;text-align:center}
.hl .n{font-weight:600;overflow-wrap:anywhere}
.hl .sbar{height:6px;border-radius:3px;background:var(--track);margin-top:5px;overflow:hidden}
.hl .sbar i{display:block;height:100%;background:var(--h);border-radius:3px}
.hl .r{text-align:right;font-size:.8rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.hl .r b{display:block;color:var(--fg);font-size:.95rem}

.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}
.cols .col{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;background:none;border:0;padding:0}
.cols .col i{width:min(24px,70%);background:var(--accent);border-radius:4px 4px 0 0;display:block;min-height:2px}
.cols .col span{position:absolute;left:0;right:0;text-align:center;font-size:.72rem;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);padding-bottom:3px}
.colx{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:.72rem;color:var(--muted);text-align:center;margin-top:4px}
.colx .best{color:var(--fg);font-weight:600}

.vbars{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;align-items:end;height:120px;border-bottom:1px solid var(--line)}
.vbars .b{height:100%;display:flex;align-items:flex-end;justify-content:center;background:none;border:0;padding:0}
.vbars .b i{width:min(24px,100%);background:var(--h);border-radius:3px 3px 0 0;display:block}
.vbars .b.sel i{outline:2px solid var(--fg);outline-offset:1px}
.vbars .goal{position:absolute;left:0;right:0;border-top:1px solid var(--muted);pointer-events:none}
.vbars .goal span{position:absolute;right:0;top:-16px;font-size:.68rem;color:var(--muted);background:var(--surface);padding:0 3px}

.insight{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:center;padding:6px 0}
.insight .e{font-size:1.3rem;text-align:center}

/* Detail-Kalender */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:.68rem;color:var(--muted);text-align:center;font-weight:600;text-transform:uppercase}
.cal button{aspect-ratio:1;border-radius:50%;border:1px solid transparent;background:none;padding:0;font-size:.82rem;font-variant-numeric:tabular-nums;display:grid;place-items:center;position:relative}
.cal .off{color:var(--muted);opacity:.55}
.cal .due{border-color:var(--line)}
.cal .miss{border-color:var(--line);color:var(--muted)}
.cal .miss::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--warn)}
.cal .done{background:var(--h);color:#fff;font-weight:600}
.cal .part{background:color-mix(in srgb,var(--h) 30%,var(--surface))}
.cal .skp{background:repeating-linear-gradient(45deg,var(--track) 0 3px,var(--line) 3px 4px);color:var(--muted)}
.cal .tod{box-shadow:0 0 0 2px var(--fg)}
.cal .fut{opacity:.3;pointer-events:none}
.callegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.74rem;color:var(--muted)}
.callegend span{display:inline-flex;align-items:center;gap:5px}
.callegend i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;text-align:center}
.rates div{background:var(--bg);border-radius:6px;padding:8px 4px}
.rates b{display:block;font-size:1.1rem}
.rates small{color:var(--muted);font-size:.72rem}
.why{border-left:3px solid var(--h);padding:4px 0 4px 12px;color:var(--fg);font-style:italic}

/* Erfolge */
.levelcard{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.levelcard .big{font-family:var(--display);font-weight:800;font-size:3.6rem;line-height:.9;color:var(--accent)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:4px;align-content:start}
.ach .e{font-size:1.7rem;line-height:1}
.ach b{font-weight:600;line-height:1.2}
.ach p{font-size:.8rem;color:var(--muted)}
.ach.lock .e{filter:grayscale(1);opacity:.45}
.ach.lock b{color:var(--muted)}
.ach .pm{height:4px;border-radius:2px;background:var(--track);overflow:hidden;margin-top:4px}
.ach .pm i{display:block;height:100%;background:var(--muted)}
.ach .when{font-size:.72rem;color:var(--accent);font-weight:600}
.xplist{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.xplist b{font-family:var(--mono);font-weight:500;text-align:right;color:var(--accent)}

/* Mehr */
.mlist{list-style:none;margin:0;padding:0}
.mlist li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.mlist li:last-child{border-bottom:0}
.mlist .e{font-size:1.25rem;text-align:center}
.mlist .n{background:none;border:0;padding:0;text-align:left;min-width:0}
.mlist .n b{display:block;font-weight:600;overflow-wrap:anywhere}
.mlist .n small{color:var(--muted)}
.mlist .ord{display:flex;gap:4px}
.mlist .ord button{width:34px;height:34px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:0}
.mlist .ord button:disabled{opacity:.3}
.field{display:grid;gap:5px;min-width:0}
.field > span{font-size:.8rem;font-weight:600;color:var(--muted)}
.field > span.hint{font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:.86rem}
.status.ok{color:var(--accent)} .status.err{color:var(--warn)}

/* Formular-Bausteine */
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{flex:1;position:relative;text-align:center}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;padding:8px 6px;font-size:.86rem;font-weight:600;color:var(--muted);cursor:pointer}
.seg label+label span{border-left:1px solid var(--line)}
.seg input:checked+span{background:var(--fg);color:var(--bg)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.wdpick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wdpick label{position:relative}
.wdpick input{position:absolute;opacity:0}
.wdpick span{display:block;text-align:center;padding:7px 0;border:1px solid var(--line);border-radius:6px;font-size:.84rem;font-weight:600;color:var(--muted);cursor:pointer}
.wdpick input:checked+span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.wdpick input:focus-visible+span{outline:2px solid var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:32px;height:32px;border-radius:50%;background:var(--sw);border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches input:checked+span{box-shadow:0 0 0 2px var(--fg)}
.swatches input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.emojis{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.emojis button{height:38px;border:1px solid transparent;background:var(--bg);border-radius:6px;font-size:1.25rem;padding:0}
.emojis button[aria-pressed="true"]{border-color:var(--fg)}
.tpls{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tpls button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:.86rem;white-space:nowrap}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pick{position:relative}
.pick input{position:absolute;opacity:0}
.pick > span{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px;cursor:pointer;font-size:.9rem;font-weight:500;min-height:58px;height:100%}
.pick > span em{font-style:normal;font-size:1.35rem;text-align:center}
.pick > span small{display:block;color:var(--muted);font-size:.74rem;font-weight:400}
.pick input:checked+span{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.pick input:focus-visible+span{outline:2px solid var(--accent)}

/* Sheet & Dialog */
.backdrop{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94dvh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:1.25rem}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;overscroll-behavior:contain}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:14px;max-height:88vh}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(10,15,20,.5);display:grid;place-items:center;padding:20px}
.dlg .box{background:var(--surface);border-radius:12px;padding:18px;width:100%;max-width:380px;display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;font-size:.86rem}

/* Timer */
.timer{display:grid;justify-items:center;gap:16px;text-align:center;padding:8px 0}
.timer .clock{position:relative;width:min(260px,70vw);aspect-ratio:1}
.timer .clock svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .clock .tr{stroke:var(--track)} .timer .clock .pr{stroke:var(--h)}
.timer .clock .t{position:absolute;inset:0;display:grid;place-content:center}
.timer .clock .t b{font-family:var(--mono);font-size:clamp(2.6rem,13vw,3.6rem);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer .clock .t span{color:var(--muted);font-size:.85rem}
.presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.presets button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:.9rem}
.presets button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Tab-Leiste */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tabbar button{background:none;border:0;display:grid;justify-items:center;align-content:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.tabbar svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--fg)}
.tabbar button[aria-current="page"] svg{stroke-width:2.3}

/* Toast & Konfetti */
.toasts{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom,0px));z-index:70;display:grid;justify-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:.9rem;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:520px;pointer-events:auto;display:flex;gap:12px;align-items:center}
.toast.err{background:var(--warn);color:#fff}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:0}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .25s ease-out}@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

/* Onboarding */
.hero{display:grid;gap:10px;padding-top:4vh}
.hero img{width:64px;height:64px;border-radius:15px}
.feat{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.feat li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start}
.feat li > span:first-child{font-size:1.2rem;text-align:center}
.empty{color:var(--muted);text-align:center;padding:24px 10px;display:grid;gap:12px;justify-items:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main class="wrap" id="view"></main>

<nav class="tabbar" id="tabbar" aria-label="Hauptnavigation" hidden>
  <div class="in">
    <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>Heute</button>
    <button data-act="tab" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistik</button>
    <button data-act="tab" data-tab="awards"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4ZM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8M9.5 17h5"/></svg>Erfolge</button>
    <button data-act="tab" data-tab="more"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Mehr</button>
  </div>
</nav>

<div class="backdrop" id="sheet" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="iconbtn" data-act="closeSheet" aria-label="Schließen">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>
</div>
<div class="dlg" id="dlg" hidden><div class="box" role="dialog" aria-modal="true" id="dlgBox"></div></div>
<div class="toasts" id="toasts" role="status"></div>
<canvas id="fx" hidden></canvas>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
